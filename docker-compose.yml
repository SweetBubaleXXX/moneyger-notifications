services:
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - db
      - redis
    command: poetry run celery -A app.celery.entrypoint worker --autoscale 2,1 --loglevel INFO --events
    restart: "no"
    volumes:
      - ./:/app:ro
    environment:
      DATABASE_URL: mongodb://db:27017?authSource=admin
      CACHE_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/2

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - db
      - redis
    command: poetry run celery -A app.celery.entrypoint beat -s /var/lib/celery/celerybeat-schedule --loglevel INFO
    restart: "no"
    volumes:
      - ./:/app:ro
      - celery_beat_data:/var/lib/celery
    environment:
      DATABASE_URL: mongodb://db:27017?authSource=admin
      CACHE_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?}@redis:6379/2

  db:
    image: mongo:4
    restart: "no"
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD:?}
      MONGODB_DATA_DIR: /data/db
    volumes:
      - database_data:/data/db

  redis:
    image: redis:7-alpine
    command: redis-server --loglevel debug --requirepass ${REDIS_PASSWORD:?}
    restart: "no"
    ports:
      - "6381:6379"

volumes:
  database_data:
  celery_beat_data:
